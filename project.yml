name: NanpaVoice
options:
  bundleIdPrefix: jp.haru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Domain:
    path: Packages/Domain
  AudioIO:
    path: Packages/AudioIO
targets:
  NanpaVoice:
    type: application
    platform: iOS
    sources:
      - path: NanpaVoice
      - path: Shared
    dependencies:
      - package: Domain
      - package: AudioIO
      - target: ShareExtension
    entitlements:
      path: NanpaVoice/NanpaVoice.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.haru.NanpaVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.haru.NanpaVoice
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 文字起こし
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 文字起こし
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # 音声ファイルを含む共有のときだけ候補に出す
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem,
              SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio").@count >= 1).@count >= 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.haru.NanpaVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.haru.NanpaVoice.ShareExtension
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  NanpaVoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NanpaVoiceUITests
    dependencies:
      - target: NanpaVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.haru.NanpaVoiceUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NanpaVoice
schemes:
  NanpaVoice:
    build:
      targets:
        NanpaVoice: all
    test:
      targets:
        - NanpaVoiceUITests
